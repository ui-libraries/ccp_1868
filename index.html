<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css?family=Playfair+Display|Playfair+Display+SC&display=swap" rel="stylesheet">
  <!-- Zoom is NOT disabled (WCAG 1.4.4 Resize Text) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive map of the communities that sent delegates to the 1868 Iowa State Colored Convention in Des Moines, with a table alternative.">
  <title>Iowa State Colored Convention: Des Moines, 1868</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin="" />
  <script src="https://kit.fontawesome.com/3625013d3b.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/leaflet.extra-markers.min.css">

  <style>
    :root {
      --parchment: #f2eecb;
      --ink: #1a1a1a;
      --focus: #0b3d91;
      /* Sizes in rem so text scales with the user's browser settings */
      --text-base: 1rem;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      width: 100%;
    }

    /* Layout: header + map stack instead of a fixed 100px header, so the header
       can grow when text is enlarged or the viewport is narrow (reflow). */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ---------- Skip link ---------- */
    .skip-link {
      position: absolute;
      left: 0.5rem;
      top: -4rem;
      z-index: 2000;
      padding: 0.6rem 1rem;
      background: var(--parchment);
      color: var(--ink);
      font-family: 'Playfair Display', serif;
      font-size: var(--text-base);
      border: 2px solid var(--ink);
    }

    .skip-link:focus {
      top: 0.5rem;
    }

    /* ---------- Visually hidden (screen-reader-only) ---------- */
    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Visible focus (WCAG 2.4.7 / 1.4.11) ---------- */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible,
    .leaflet-marker-icon:focus-visible,
    .leaflet-container:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px #ffffff;
    }

    /* Header keeps the Washington convention image; text sits on a solid
       parchment panel so contrast does not depend on the image. */
    header {
      background-image: url('images/Washington_CC.png');
      background-size: cover;
      background-position: center;
      background-color: #000000;
      box-shadow: 0px 5px 5px black;
      position: relative;
      z-index: 800;
      padding: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .title-block {
      background: var(--parchment);
      color: var(--ink);
      padding: 0.4rem 0.75rem 0.5rem;
      border-radius: 2px;
      max-width: 100%;
    }

    h1 {
      font-family: 'Playfair Display SC', serif;
      font-size: 1.75rem;
      line-height: 1.2;
      color: var(--ink);
      margin: 0;
      font-weight: normal;
    }

    .credit {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      line-height: 1.4;
      color: var(--ink);
      margin: 0.25rem 0 0;
    }

    .credit a {
      color: var(--ink);
      text-decoration: underline;
    }

    .header-actions {
      margin-left: auto;
    }

    .btn {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      min-height: 44px;
      min-width: 44px;
      padding: 0.5rem 1rem;
      background: var(--parchment);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background: #ffffff;
    }

    /* ---------- Map area ---------- */
    main {
      position: relative;
      flex: 1 1 auto;
      min-height: 20rem;
    }

    #map {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    /* ---------- Popups ---------- */
    .leaflet-popup-content-wrapper {
      background-color: var(--parchment);
      color: var(--ink);
    }

    .leaflet-popup-tip {
      background: var(--parchment);
    }

    .leaflet-popup-content {
      margin: 0.75rem 1rem;
    }

    .leaflet-popup-content-wrapper:focus,
    .leaflet-popup:focus {
      outline: none;
    }

    .leaflet-popup-close-button {
      /* larger, higher-contrast target (WCAG 2.5.8) */
      width: 44px !important;
      height: 44px !important;
      font-size: 28px !important;
      line-height: 44px !important;
      color: var(--ink) !important;
      top: 0 !important;
      right: 0 !important;
    }

    .popup-title {
      font-family: 'Playfair Display SC', serif;
      font-size: 1.125rem;
      font-weight: normal;
      margin: 0 1.5rem 0.5rem 0;
    }

    .popup-body {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      line-height: 1.5;
      margin: 0 0 0.5rem;
    }

    /* ---------- Layer control & zoom ---------- */
    .leaflet-control-layers-expanded {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-style: italic;
      background-color: var(--parchment);
      color: var(--ink);
      padding: 0.5rem 0.75rem;
    }

    .leaflet-control-layers-selector {
      width: 1.25rem;
      height: 1.25rem;
      margin: 0 0.5rem 0 0;
      vertical-align: middle;
    }

    .leaflet-control-layers label {
      display: block;
      padding: 0.35rem 0;
      cursor: pointer;
    }

    .leaflet-bar a {
      background-color: var(--parchment);
      color: var(--ink);
    }

    .leaflet-control-attribution,
    .leaflet-control-scale-line {
      color: var(--ink);
    }

    /* ---------- Data table panel ---------- */
    #data-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(34rem, 100%);
      z-index: 1100;
      background: var(--parchment);
      color: var(--ink);
      border-left: 3px solid var(--ink);
      display: flex;
      flex-direction: column;
      font-family: 'Playfair Display', serif;
    }

    #data-panel[hidden] {
      display: none;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--ink);
    }

    .panel-head h2 {
      font-family: 'Playfair Display SC', serif;
      font-size: 1.25rem;
      font-weight: normal;
      margin: 0;
    }

    #data-summary {
      margin: 0;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      line-height: 1.5;
    }

    .table-wrap {
      overflow: auto;
      padding: 0 0.75rem 0.75rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 1rem;
      line-height: 1.45;
    }

    caption {
      text-align: left;
      font-weight: bold;
      padding-bottom: 0.4rem;
    }

    th,
    td {
      border: 1px solid var(--ink);
      padding: 0.4rem 0.5rem;
      text-align: left;
      vertical-align: top;
    }

    thead th {
      background: #e2dca0;
    }

    td.num,
    th.num {
      text-align: right;
    }

    /* ---------- Load error ---------- */
    #load-error {
      position: absolute;
      z-index: 1200;
      left: 50%;
      top: 1rem;
      transform: translateX(-50%);
      max-width: 90%;
      background: #fff;
      color: #7a0000;
      border: 2px solid #7a0000;
      padding: 0.75rem 1rem;
      font-family: 'Playfair Display', serif;
    }

    /* Override will-change CSS attribute to fix map page not fully rendering on Firefox */
    .leaflet-fade-anim .leaflet-tile,
    .leaflet-zoom-anim .leaflet-zoom-animated {
      will-change: auto !important;
    }

    /* Respect "reduce motion" preference (WCAG 2.3.3) */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

</head>

<body>
  <a class="skip-link" href="#map">Skip to map</a>

  <header>
    <div class="title-block">
      <h1>Iowa State Colored Convention: Des Moines, 1868</h1>
      <p class="credit">Markers customized with <a href="https://github.com/coryasilva/Leaflet.ExtraMarkers">Leaflet Extra Markers</a> based on <a href="https://fontawesome.com/license">Font Awesome</a> icons</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn" id="data-toggle" aria-expanded="false" aria-controls="data-panel">View data as table</button>
    </div>
  </header>

  <main>
    <!-- Map. Leaflet makes this container focusable; arrow keys pan, + / - zoom. -->
    <div id="map" role="region" aria-label="Interactive map of Iowa showing delegate origin communities and the convention site in Des Moines. Use arrow keys to pan, plus and minus to zoom, Tab to move between markers, and Enter to open a marker's details. A table version of this information is available from the View data as table button."></div>

    <section id="data-panel" aria-labelledby="data-panel-title" hidden>
      <div class="panel-head">
        <h2 id="data-panel-title" tabindex="-1">Delegate communities</h2>
        <button type="button" class="btn" id="data-close">Close table</button>
      </div>
      <p id="data-summary"></p>
      <div class="table-wrap" role="region" aria-label="Delegate table (scrollable)" tabindex="0">
        <table id="data-table">
          <caption>Communities that sent delegates to the 1868 convention in Des Moines</caption>
          <thead>
            <tr>
              <th scope="col">Community</th>
              <th scope="col" class="num">Delegates</th>
              <th scope="col">About</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </section>

    <div id="load-error" role="alert" hidden></div>
  </main>

  <!-- Polite live region for layer toggles and status messages -->
  <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="https://d3js.org/d3.v4.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js" integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og==" crossorigin=""></script>
  <script src="js/leaflet.extra-markers.min.js"></script>
  <script src="js/Leaflet.Canvas-Flowmap-Layer.js"></script>

  <script>
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var liveRegion = document.getElementById('live-region');

    function announce(message) {
      // Clear then set so repeated messages are re-announced
      liveRegion.textContent = '';
      setTimeout(function() { liveRegion.textContent = message; }, 50);
    }

    // Map
    var map = L.map('map', {
      center: [41.974961382786724, -93.36946049692045],
      minZoom: 5,
      maxZoom: 10,
      zoomSnap: 1,
      keyboard: true,
      zoomAnimation: !prefersReducedMotion,
      fadeAnimation: !prefersReducedMotion,
      markerZoomAnimation: !prefersReducedMotion
    });

    // Fit to overlay bounds (SW and NE points with (lat, lon))
    map.fitBounds([
      [40.535856, -96.446275],
      [43.509765, -90.119228]
    ]);

    // define the basemap using the thunderforest pioneer map and set minimum and maximum zoom levels
    var basemap = L.tileLayer('https://tile.thunderforest.com/pioneer/{z}/{x}/{y}.png?apikey=dd2dca516d114fd89c0b1403358cbfa8', {
      attribution: '&copy; <a href="http://www.thunderforest.com/">Thunderforest</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      apikey: '<dd2dca516d114fd89c0b1403358cbfa8>',
      maxZoom: 10,
      minZoom: 5,
    }).addTo(map);

    // Overlay layers (TMS) - decorative raster tiles (Leaflet gives them alt="")
    var lyr = L.tileLayer('./{z}/{x}/{y}.png', {
      tms: true,
      opacity: 1.0,
      attribution: "",
      minZoom: 5,
      maxZoom: 10
    }).addTo(map);

    // add a scale bar
    L.control.scale().addTo(map);

    // load the data asynchronously
    d3.queue()
      .defer(d3.json, 'data/DesMoines_1868_communities.geojson')
      .defer(d3.json, 'data/Convention.geojson')
      .await(drawMap);

    function showLoadError() {
      var box = document.getElementById('load-error');
      box.textContent = 'Sorry, the map data could not be loaded. Please reload the page or try again later.';
      box.hidden = false;
    }

    function plural(n, word) {
      return n + ' ' + word + (Number(n) === 1 ? '' : 's');
    }

    // Give each marker a name, role and keyboard behavior for assistive technology
    function decorateMarker(layer, label) {
      function apply() {
        var el = layer.getElement && layer.getElement();
        if (!el) return;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', label);
        el.setAttribute('aria-haspopup', 'dialog');
        el.setAttribute('title', label);
        el.setAttribute('tabindex', '0');
        // Font Awesome icon inside the marker is decorative
        var icon = el.querySelector('i');
        if (icon) icon.setAttribute('aria-hidden', 'true');
      }
      apply();
      layer.on('add', apply); // re-apply if the layer is toggled off and on
    }

    // draw data on Map
    function drawMap(err, origins, burns) {

      if (err || !origins || !burns) {
        showLoadError();
        return;
      }

      // create communities location Leaflet GeoJSON layer and style with Extra Markers
      var communities = L.geoJson(origins, {
        pointToLayer: function(feature, ll) {
          return L.marker(ll, {
            keyboard: true,
            icon: L.ExtraMarkers.icon({
              icon: 'fas fa-home',
              prefix: 'fa',
              markerColor: 'green',
              iconColor: '#f2eecb'
            })
          })
        }
      }).addTo(map);

      // create convention location Leaflet GeoJSON layer and style with Extra Markers
      var convention = L.geoJson(burns, {
        pointToLayer: function(feature, ll) {
          return L.marker(ll, {
            keyboard: true,
            icon: L.ExtraMarkers.icon({
              icon: 'fas fa-place-of-worship',
              prefix: 'fa',
              markerColor: 'red',
              iconColor: '#f2eecb'
            })
          })
        }
      }).addTo(map);

      var trips = L.canvasFlowmapLayer(origins, {
        // required property for this custom layer,
        // which relies on the property names of your own data
        originAndDestinationFieldIds: {
          originUniqueIdField: 'origin_id',
          originGeometry: {
            x: 'X_Long',
            y: 'Y_Lat'
          },
          destinationUniqueIdField: 'destination_id',
          destinationGeometry: {
            x: 'Burns_Long',
            y: 'Burns_Lat'
          }
        },
        canvasBezierStyle: {
          type: 'classBreaks',
          field: 'Delegate_Count',
          // Opacity raised from 0.5 to 0.85 for stronger non-text contrast (WCAG 1.4.11).
          // Line width still encodes delegate count; the same numbers are in the data table.
          classBreakInfos: [{
            classMinValue: 1,
            classMaxValue: 1,
            symbol: {
              strokeStyle: 'rgba(139, 0, 0, 0.85)',
              lineWidth: 2,
              lineCap: 'round'
            }
          }, {
            classMinValue: 2,
            classMaxValue: 2,
            symbol: {
              strokeStyle: 'rgba(139, 0, 0, 0.85)',
              lineWidth: 4,
              lineCap: 'round'
            }
          }, {
            classMinValue: 3,
            classMaxValue: 3,
            symbol: {
              strokeStyle: 'rgba(139, 0, 0, 0.85)',
              lineWidth: 6,
              lineCap: 'round'
            }
          }, {
            classMinValue: 4,
            classMaxValue: 4,
            symbol: {
              strokeStyle: 'rgba(139, 0, 0, 0.85)',
              lineWidth: 8,
              lineCap: 'round'
            }
          }, {
            classMinValue: 5,
            classMaxValue: 5,
            symbol: {
              strokeStyle: 'rgba(139, 0, 0, 0.85)',
              lineWidth: 10,
              lineCap: 'round'
            }
          }],
        },
        style: function(geoJsonFeature) {
          return {
            weight: 0,
            fillOpacity: 0
          };
        }
      }).addTo(map);

      // The journey lines are drawn on <canvas>, which has no text equivalent.
      // Hide it from assistive tech; the data table carries the same information.
      function hideCanvasFromAT() {
        var canvases = document.querySelectorAll('#map canvas');
        for (var i = 0; i < canvases.length; i++) {
          canvases[i].setAttribute('aria-hidden', 'true');
          canvases[i].setAttribute('role', 'presentation');
        }
      }
      hideCanvasFromAT();

      // add content to popup window using the Leaflet GeoJSON layer properties
      communities.eachLayer(function(layer) {

        var props = layer.feature.properties;
        var titleId = 'popup-title-' + L.stamp(layer);

        layer.bindPopup(
          "<h3 class='popup-title' id='" + titleId + "'>" + props.Community + "</h3>" +
          "<p class='popup-body'>Delegates: " + props.Delegate_Count + "</p>" +
          "<p class='popup-body'>" + props.Community_Info + "</p>", {
            maxHeight: 300,
            minWidth: 200,
            autoPanPadding: [20, 20]
          });
        layer._popupTitleId = titleId;

        decorateMarker(layer, 'Delegate origin: ' + props.Community + ', ' +
          plural(props.Delegate_Count, 'delegate') + '. Press Enter for details.');
      });

      // add content to popup window using the Leaflet GeoJSON layer properties
      convention.eachLayer(function(layer) {

        var props = layer.feature.properties;
        var titleId = 'popup-title-' + L.stamp(layer);

        layer.bindPopup(
          "<h3 class='popup-title' id='" + titleId + "'>" + props.Community + "</h3>" +
          "<p class='popup-body'>Convention Site:<br>Black Methodist Episcopal Church<br>(Later known as Burns United Methodist Church)</p>", {
            maxHeight: 300,
            minWidth: 200,
            autoPanPadding: [20, 20]
          });
        layer._popupTitleId = titleId;

        decorateMarker(layer, 'Convention site: ' + props.Community +
          ', Black Methodist Episcopal Church. Press Enter for details.');
      });

      // designate the layers as overlays
      var overlays = {
        "Convention Site": convention,
        "Delegate Origins": communities,
        "Delegate Journeys": trips
      };

      // all done with the layers, add them to layer control
      var layerControl = L.control.layers(null, overlays, {
        collapsed: false,
      }).addTo(map);

      // Name the layer control group for screen readers
      var lcContainer = layerControl.getContainer();
      lcContainer.setAttribute('role', 'group');
      lcContainer.setAttribute('aria-label', 'Map layers');

      // Announce layer visibility changes
      map.on('overlayadd', function(e) {
        announce(e.name + ' layer shown.');
        setTimeout(hideCanvasFromAT, 0);
      });
      map.on('overlayremove', function(e) {
        announce(e.name + ' layer hidden.');
      });

      // ---------- Popup focus management ----------
      // Move focus into the popup when it opens, and back to the marker when it closes.
      map.on('popupopen', function(e) {
        var popup = e.popup;
        var container = popup._container;
        var source = popup._source;
        if (!container) return;

        container.setAttribute('role', 'dialog');
        container.setAttribute('aria-modal', 'false');
        if (source && source._popupTitleId) {
          container.setAttribute('aria-labelledby', source._popupTitleId);
        }
        container.setAttribute('tabindex', '-1');

        var closeBtn = container.querySelector('.leaflet-popup-close-button');
        if (closeBtn) {
          closeBtn.setAttribute('role', 'button');
          closeBtn.setAttribute('aria-label', 'Close popup');
          closeBtn.setAttribute('title', 'Close popup');
          closeBtn.addEventListener('keydown', function(ev) {
            if (ev.key === ' ' || ev.key === 'Spacebar') {
              ev.preventDefault();
              popup._close();
            }
          });
        }

        // Scrollable popup content must be reachable by keyboard
        var scroller = container.querySelector('.leaflet-popup-content');
        if (scroller && scroller.scrollHeight > scroller.clientHeight) {
          scroller.setAttribute('tabindex', '0');
        }

        container.focus({ preventScroll: true });
      });

      map.on('popupclose', function(e) {
        var container = e.popup._container;
        var source = e.popup._source;
        var focusInside = container && container.contains(document.activeElement);
        var focusLost = document.activeElement === document.body;
        if ((focusInside || focusLost) && source && source.getElement && source.getElement()) {
          source.getElement().focus({ preventScroll: true });
        }
      });

      // ---------- Data table alternative ----------
      buildTable(origins);
    }; // end drawMap function

    // Build an HTML table from the GeoJSON so the map's information is available as text
    function buildTable(origins) {
      var rows = origins.features.map(function(f) { return f.properties; });
      rows.sort(function(a, b) { return String(a.Community).localeCompare(String(b.Community)); });

      var total = 0;
      var tbody = document.querySelector('#data-table tbody');
      rows.forEach(function(p) {
        var count = Number(p.Delegate_Count) || 0;
        total += count;
        var tr = document.createElement('tr');

        var th = document.createElement('th');
        th.scope = 'row';
        th.textContent = p.Community;
        th.style.fontWeight = 'normal';

        var tdCount = document.createElement('td');
        tdCount.className = 'num';
        tdCount.textContent = count;

        var tdInfo = document.createElement('td');
        tdInfo.innerHTML = p.Community_Info || '';

        tr.appendChild(th);
        tr.appendChild(tdCount);
        tr.appendChild(tdInfo);
        tbody.appendChild(tr);
      });

      var tfoot = document.querySelector('#data-table tfoot');
      tfoot.innerHTML = '<tr><th scope="row">Total</th><td class="num"></td><td></td></tr>';
      tfoot.querySelector('td.num').textContent = total;

      document.getElementById('data-summary').textContent =
        rows.length + ' communities sent ' + total + ' delegates to the convention at the ' +
        'Black Methodist Episcopal Church in Des Moines, 1868. On the map, the line from each ' +
        'community to Des Moines gets thicker as its delegate count increases.';
    }

    // ---------- Data panel toggle ----------
    (function() {
      var toggle = document.getElementById('data-toggle');
      var panel = document.getElementById('data-panel');
      var closeBtn = document.getElementById('data-close');
      var title = document.getElementById('data-panel-title');

      function openPanel() {
        panel.hidden = false;
        toggle.setAttribute('aria-expanded', 'true');
        toggle.textContent = 'Hide data table';
        title.focus();
      }

      function closePanel() {
        panel.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'View data as table';
        toggle.focus();
      }

      toggle.addEventListener('click', function() {
        if (panel.hidden) { openPanel(); } else { closePanel(); }
      });
      closeBtn.addEventListener('click', closePanel);
      panel.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.key === 'Esc') {
          e.stopPropagation();
          closePanel();
        }
      });
    })();
  </script>

</body>

</html>
